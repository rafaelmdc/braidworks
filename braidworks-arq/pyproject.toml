[project]
name = "braidworks-arq"
version = "0.1.3"
description = "Distributed execution for Braidworks — run weave-steps on arq workers over Redis (async-native: durable queue, cross-machine fan-out, global rate-limiting)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["braidworks-core>=0.3.0", "arq>=0.26", "redis>=5.0"]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/braidworks_arq"]

[tool.uv.sources]
braidworks-core = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
