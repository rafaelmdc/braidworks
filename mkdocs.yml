site_name: Braidworks
site_description: Look up fields for your identifiers across biological databases.
site_url: https://rafaelmdc.github.io/braidworks/
repo_url: https://github.com/rafaelmdc/braidworks
repo_name: rafaelmdc/braidworks
edit_uri: edit/main/docs/
docs_dir: docs
strict: true

exclude_docs: |
  internal/
  superpowers/
  diagrams/

hooks:
  - tools/mkdocs/github_links.py

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle: {icon: material/weather-sunny, name: Light mode}

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc: {permalink: true}
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  links:
    not_found: warn
    anchors: warn
    absolute_links: relative_to_docs
    unrecognized_links: warn

# The four Diátaxis types are the top-level navigation.
nav:
