[project]
name = "braidworks-celery"
version = "0.1.1"
description = "Distributed execution for Braidworks — run weave-steps on Celery workers over a Redis broker (durable queue, cross-machine fan-out, global rate-limiting)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["braidworks-core>=0.1.3", "celery>=5.4", "redis>=5.0"]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/braidworks_celery"]

[tool.uv.sources]
braidworks-core = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
