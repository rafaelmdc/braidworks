[project]
name = "weaverkit"
version = "0.3.0"
description = "Guardrails for building Braidworks weavers: spec, scaffold, and conformance."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["braidworks-core>=0.8.0"]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]
# Optional GUI server (`weaverkit serve`). Kept out of the base install so weavers,
# conformance, scaffold, and CI stay stdlib-only.
serve = ["fastapi>=0.110", "uvicorn>=0.27"]

[project.scripts]
weaverkit = "weaverkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weaverkit"]

[tool.uv.sources]
braidworks-core = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
