// ---- layout (standardized node sizing) -------------------------------------
const COL_GAP = 264, ROW_GAP = 86;
const TYPE_H = 30, TYPE_MIN_W = 96, OP_H = 52, OP_MIN_W = 158;

function computeLayout(graph) {
  const nodes = new Map(graph.nodes.map((n) => [n.id, { ...n }]));
  const outAdj = new Map(), inAdj = new Map(), indeg = new Map();
  for (const n of nodes.keys()) { outAdj.set(n, []); inAdj.set(n, []); indeg.set(n, 0); }
  const incoming = new Set(), outgoing = new Set();
  for (const e of graph.edges) {
    if (!nodes.has(e.source) || !nodes.has(e.target) || e.source === e.target) continue;
    outAdj.get(e.source).push(e.target);
    inAdj.get(e.target).push(e.source);
    indeg.set(e.target, indeg.get(e.target) + 1);
    incoming.add(e.target); outgoing.add(e.source);
  }
  // A type that is produced (has incoming) is a weaver output; one that is consumed
  // (has outgoing) is a weaver input; one that is both is mixed.
  for (const n of nodes.values()) {
    if (n.kind !== "type") continue;
    const produced = incoming.has(n.id), consumed = outgoing.has(n.id);
    n.io = produced && consumed ? "mixed" : produced ? "out" : "in";
  }

  // Longest-path layering via Kahn topological order.
  const level = new Map([...nodes.keys()].map((k) => [k, 0]));
  const deg = new Map(indeg);
  const queue = [...nodes.keys()].filter((k) => deg.get(k) === 0);
  const seen = new Set();
  while (queue.length) {
    const u = queue.shift();
    if (seen.has(u)) continue;
    seen.add(u);
    for (const v of outAdj.get(u)) {
      level.set(v, Math.max(level.get(v), level.get(u) + 1));
      deg.set(v, deg.get(v) - 1);
      if (deg.get(v) === 0) queue.push(v);
    }
  }
  for (const k of nodes.keys()) {
    if (!seen.has(k)) {
      const parents = inAdj.get(k).map((p) => level.get(p));
      level.set(k, parents.length ? Math.max(...parents) + 1 : 0);
    }
  }
  const cols = new Map();
  for (const [k, lv] of level) { if (!cols.has(lv)) cols.set(lv, []); cols.get(lv).push(k); }
  const levels = [...cols.keys()].sort((a, b) => a - b);

  // Barycenter sweeps to reduce crossings.
  const order = new Map();
  levels.forEach((lv) => cols.get(lv).forEach((k, i) => order.set(k, i)));
  const bary = (k, adj) => {
    const ns = adj.get(k);
    return ns.length ? ns.reduce((s, n) => s + order.get(n), 0) / ns.length : order.get(k);
  };
  for (let pass = 0; pass < 6; pass++) {
    const seq = pass % 2 ? [...levels].reverse() : levels;
    const adj = pass % 2 ? outAdj : inAdj;
    for (const lv of seq) {
      cols.get(lv).sort((a, b) => bary(a, adj) - bary(b, adj));
      cols.get(lv).forEach((k, i) => order.set(k, i));
    }
  }

  const mctx = document.createElement("canvas").getContext("2d");
  let minY = Infinity, maxY = -Infinity, minX = Infinity, maxX = -Infinity;
  for (const lv of levels) {
    const arr = cols.get(lv);
    const totalH = arr.length * ROW_GAP;
    arr.forEach((k, i) => {
      const n = nodes.get(k);
      const isOp = n.kind === "op";
      const lines = (n.label || k).split("\n");
      mctx.font = (isOp ? "600 13" : "500 12.5") + "px Inter, sans-serif";
      const tw = Math.max(...lines.map((t) => mctx.measureText(t).width));
      n.w = Math.max(tw + (isOp ? 36 : 26), isOp ? OP_MIN_W : TYPE_MIN_W);
      n.h = isOp ? OP_H : TYPE_H;
      n.x = lv * COL_GAP;
      n.y = i * ROW_GAP - totalH / 2 + ROW_GAP / 2;
      n.level = lv;
      minX = Math.min(minX, n.x - n.w / 2); maxX = Math.max(maxX, n.x + n.w / 2);
      minY = Math.min(minY, n.y - n.h); maxY = Math.max(maxY, n.y + n.h);
    });
  }
  return { nodes, edges: graph.edges, bbox: { minX, maxX, minY, maxY } };
}

  const [x0, y0, x1, y1, x2, y2, x3, y3] = a, m = 1 - p;

    m*m*m*y0 + 3*m*m*p*y1 + 3*m*p*p*y2 + p*p*p*y3,
  ];
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
// A contained, top-down "spider": the node body wears 8 short two-jointed legs
// (4 per side), splayed off-center so the edge still exits cleanly from the middle.
// Reach is small (~15px world) so legs never touch neighbouring nodes.
const LEG_YS = [-0.42, -0.18, 0.18, 0.42];   // 4 attach points per side, off-center
function drawLegs(sx, sy, w, h, color, sc, lit) {
  ctx.strokeStyle = color; ctx.lineWidth = 1 * Math.max(sc, 0.5);
  ctx.globalAlpha = lit ? 0.26 : 0.10; ctx.lineCap = "round"; ctx.lineJoin = "round";
  for (const side of [-1, 1]) {              // left / right body edge
    const bx = sx + side * (w / 2);
    for (const ry of LEG_YS) {
      const by = sy + ry * h;
      const splay = ry < 0 ? -1 : 1;         // upper legs angle up, lower legs down
      const kx = bx + side * 9 * sc, ky = by + splay * 6 * sc;     // knee
      const fx = kx + side * 7 * sc, fy = ky + splay * 9 * sc;     // foot
      ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(kx, ky); ctx.lineTo(fx, fy); ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
}

// A tiny "face" under the spider's body: a very squashed ellipse (mouth) with two
// downward triangle fangs near its centre. Drawn in the weaver colour, just below the
// body's bottom edge. Hidden when zoomed out so it never turns to noise.
function drawFace(sx, sy, w, h, color, sc, lit) {
  if (sc < 0.34) return;
  const rx = 11 * sc, ry = 3.2 * sc;
  // Mouth centre is tucked slightly up into the body so it reads as attached; the part
  // that lands inside the body is CLIPPED away (below the bottom edge only), so no
  // ellipse arc ever shows through the node — just a mouth emerging from underneath.
  const cx = sx, cy = sy + h / 2 + ry * 0.4, edge = sy + h / 2;
  ctx.save();
  ctx.beginPath(); ctx.rect(0, edge, innerWidth, innerHeight); ctx.clip();
  ctx.strokeStyle = color; ctx.fillStyle = color;
  ctx.lineWidth = 1 * Math.max(sc, 0.5); ctx.lineJoin = "round"; ctx.lineCap = "round";
  ctx.globalAlpha = lit ? 0.26 : 0.10;   // match the legs — subtle, not invasive
  ctx.beginPath();
  ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);   // squashed mouth (top arc clipped)
  ctx.stroke();
  // Two fangs rooted on the mouth's lower arc, tilted outward so they align to it.
  const L = 5.5 * sc, hw = 1.5 * sc, phi = 0.34;
  const fang = (ox, s) => {
    const ax = cx + ox;
    const ay = cy + ry * Math.sqrt(Math.max(0, 1 - (ox / rx) ** 2));  // on the lower arc
    const dx = s * Math.sin(phi), dy = Math.cos(phi);                 // down + outward
    const px = dy, py = -dx;                                          // base along the curve
    ctx.beginPath();
    ctx.moveTo(ax + hw * px, ay + hw * py);
    ctx.lineTo(ax - hw * px, ay - hw * py);
    ctx.lineTo(ax + L * dx, ay + L * dy);
    ctx.closePath(); ctx.fill();
  };
  fang(-3.5 * sc, -1); fang(3.5 * sc, 1);
  ctx.restore();
  ctx.globalAlpha = 1;
}

let lastT = performance.now();
function frame(now) {
  const dt = Math.min((now - lastT) / 1000, 0.05); lastT = now;
  const L = layouts[current], parts = particles[current];
  const focus = hover || pinned;
  const focusEdges = new Set();
  const focusNodes = new Set();
  // A hovered/pinned node wins; otherwise a build-mode route preview dims to its path.
  const useRoute = !focus && routeFocus && current === 0;
  const active = !!focus || useRoute;
  if (focus) {
    focusNodes.add(focus);
    L.edges.forEach((e, i) => {
      if (e.source === focus || e.target === focus) {
        focusEdges.add(i); focusNodes.add(e.source); focusNodes.add(e.target);
      }
    });
  } else if (useRoute) {
    routeFocus.nodes.forEach((id) => focusNodes.add(id));
    L.edges.forEach((e, i) => {
      if (routeFocus.edgeKeys.has(e.source + ">" + e.target)) focusEdges.add(i);
    });
  }

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const g = ctx.createRadialGradient(innerWidth*0.6, innerHeight*0.42, 60,
    innerWidth*0.6, innerHeight*0.42, Math.max(innerWidth, innerHeight));
  g.addColorStop(0, "#0a0f1f"); g.addColorStop(1, "#060810");
  ctx.fillStyle = g; ctx.fillRect(0, 0, innerWidth, innerHeight);

  // edges
  ctx.lineCap = "round";
  L.edges.forEach((e, i) => {
    const s = L.nodes.get(e.source), t = L.nodes.get(e.target);
    if (!s || !t) return;
    const a = edgeAnchors(s, t);
    const lit = !active || focusEdges.has(i);
    ctx.beginPath();
    ctx.moveTo(...toScreen(a[0], a[1]));
    const c1 = toScreen(a[2], a[3]), c2 = toScreen(a[4], a[5]), p3 = toScreen(a[6], a[7]);
    ctx.bezierCurveTo(c1[0], c1[1], c2[0], c2[1], p3[0], p3[1]);
    ctx.strokeStyle = weaverColor(e.weaver || "core", lit ? 58 : 40, lit ? 46 : 22);
    ctx.globalAlpha = lit ? 0.42 : 0.08;
    ctx.lineWidth = Math.max(0.9, 1.3 * cam.scale);
    ctx.stroke();
    ctx.globalAlpha = 1;

    // flowing particles
    ctx.globalCompositeOperation = "lighter";
    const speed = (active && !focusEdges.has(i)) ? 0 : (lit ? 0.30 : 0.14);
    parts[i].forEach((ph, k) => {
      ph = (ph + speed * dt) % 1; parts[i][k] = ph;
      const [wx, wy] = bezier(a, ph);
      const [px, py] = toScreen(wx, wy);
      const r = (lit ? 2.4 : 1.6) * Math.max(cam.scale, 0.5);
      const rg = ctx.createRadialGradient(px, py, 0, px, py, r * 3);
      rg.addColorStop(0, weaverColor(e.weaver || "core", 78, 60));
      rg.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = rg; ctx.globalAlpha = lit ? 0.85 : 0.25;
      ctx.beginPath(); ctx.arc(px, py, r * 3, 0, 7); ctx.fill();
    });
    ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;

    // one→many fan dimension: badge the producer→key edge so set-valued outputs read
    // as "this link fans out" without opening the card.
    if (e.fan) {
      const [mx, my] = toScreen(...bezier(a, 0.5));
      const label = "⤜ fan";
      ctx.font = `${Math.max(9, 9.5 * cam.scale)}px Inter, sans-serif`;
      const tw = ctx.measureText(label).width;
      ctx.globalAlpha = lit ? 0.96 : 0.3;
      ctx.fillStyle = "rgba(8,12,26,0.88)";
      roundRect(mx - tw / 2 - 5, my - 8, tw + 10, 16, 5); ctx.fill();
      ctx.fillStyle = weaverColor(e.weaver || "core", 82, 68);
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(label, mx, my);
      ctx.textAlign = "start"; ctx.textBaseline = "alphabetic";
      ctx.globalAlpha = 1;
    }
  });

  // nodes
  L.nodes.forEach((n) => {
    const [sx, sy] = toScreen(n.x, n.y);
    const w = n.w * cam.scale, h = n.h * cam.scale;
    let lit = !active || focusNodes.has(n.id);
    if (searchHits && !searchHits.has(n.id)) lit = false;  // search filter dims non-matches
    const isOp = n.kind === "op";
    let base = isOp ? weaverColor(n.weaver, 60) : (TYPE_COLOR[n.io] || TYPE_IN);
    // Run light-up: op nodes reveal wave-by-wave — green when the step ran, red on error.
    const rs = isOp ? runStatusOf(n.id, now) : null;
    let glow = 0;
    if (rs === "pending") { lit = false; }
    else if (rs === "ok") { base = "#5fd0a0"; glow = 16; }
    else if (rs === "error") { base = "#e0706e"; glow = 20; }
    ctx.globalAlpha = lit ? 1 : 0.26;

    if (isOp) {
      drawLegs(sx, sy, w, h, base, cam.scale, lit);
      ctx.shadowColor = base;
      ctx.shadowBlur = ((n.id === focus ? 16 : 8) + glow) * Math.max(cam.scale, 0.4);
      roundRect(sx - w/2, sy - h/2, w, h, 10);
      ctx.fillStyle = "rgba(13,18,32,0.97)"; ctx.fill();
      ctx.shadowBlur = 0;
      ctx.lineWidth = (n.id === focus ? 2 : 1.4); ctx.strokeStyle = base; ctx.stroke();
      drawFace(sx, sy, w, h, base, cam.scale, lit);
    } else {
      ctx.shadowBlur = 0;
      roundRect(sx - w/2, sy - h/2, w, h, h/2);
      ctx.fillStyle = "rgba(11,15,26,0.95)"; ctx.fill();
      ctx.lineWidth = (n.id === focus ? 1.8 : 1.2); ctx.strokeStyle = base;
      ctx.globalAlpha = (lit ? 1 : 0.26) * 0.8; ctx.stroke(); ctx.globalAlpha = lit ? 1 : 0.26;
      ctx.beginPath(); ctx.arc(sx - w/2 + 11*cam.scale, sy, 3*Math.max(cam.scale,0.5), 0, 7);
      ctx.fillStyle = base; ctx.fill();
    }

    // Build-mode selection ring: have (green) / through (amber) / want (blue).
    if (buildSel && buildSel[n.id]) {
      const role = buildSel[n.id];
      const rc = role === "have" ? "#5fd0a0" : role === "through" ? "#e8c069" : "#6f9bff";
      ctx.save();
      ctx.globalAlpha = 1; ctx.shadowColor = rc;
      ctx.shadowBlur = 20 * Math.max(cam.scale, 0.5);
      ctx.lineWidth = 3; ctx.strokeStyle = rc;
      const pad = 4 * cam.scale;
      roundRect(sx - w/2 - pad, sy - h/2 - pad, w + 2*pad, h + 2*pad, isOp ? 12 : (h/2 + pad));
      ctx.stroke(); ctx.restore();
    }

    if (cam.scale > 0.32 || n.id === focus) {
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      const lines = (n.label || n.id).split("\n");
      const fs = (isOp ? 13 : 12) * Math.min(cam.scale, 1.2);
      lines.forEach((ln, li) => {
        ctx.font = (isOp && li === 0 ? "700 " : isOp ? "500 " : "500 ") + fs + "px Inter, sans-serif";
        ctx.fillStyle = isOp ? (li === 0 ? "#eef2fb" : "#9aa8ca") : "#c6d1ec";
        ctx.fillText(ln, sx + (isOp ? 0 : 6*cam.scale),
          sy + (lines.length > 1 ? (li - 0.5) * fs * 1.3 : 0));
      });
    }
    ctx.globalAlpha = 1;
  });
  ctx.shadowBlur = 0;
  requestAnimationFrame(frame);
}

// ---- hit testing + interaction ---------------------------------------------
function nodeAt(sx, sy) {
  const [wx, wy] = toWorld(sx, sy);
  for (const n of layouts[current].nodes.values()) {
    if (Math.abs(wx - n.x) <= n.w/2 + 4 && Math.abs(wy - n.y) <= n.h/2 + 4) return n;
  }
  return null;
}
canvas.addEventListener("mousemove", (e) => {
  if (dragging) {
    cam.x += e.clientX - lastX; cam.y += e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    // Only count it as a drag past a small threshold, so a click with tiny jitter still
    // registers (otherwise a 1px wobble between down and up would swallow the click).
    if (Math.hypot(e.clientX - downX, e.clientY - downY) > 4) moved = true;
    return;
  }
  const n = nodeAt(e.clientX, e.clientY);
  hover = n ? n.id : null;
  canvas.style.cursor = n ? "pointer" : "grab";
});
canvas.addEventListener("mousedown", (e) => {
  dragging = true; moved = false; lastX = e.clientX; lastY = e.clientY;
  downX = e.clientX; downY = e.clientY;
  canvas.classList.add("dragging");
});
addEventListener("mouseup", () => { dragging = false; canvas.classList.remove("dragging"); });
canvas.addEventListener("click", (e) => {
  if (moved) return;
  const n = nodeAt(e.clientX, e.clientY);
  if (buildMode && onBuildClick) { onBuildClick(n, e.clientX, e.clientY); return; }
  pinned = n ? n.id : null;
  showCard(n, e.clientX, e.clientY);
});
addEventListener("keydown", (e) => { if (e.key === "Escape") { pinned = null; closeCard(); } });
canvas.addEventListener("wheel", (e) => {
  e.preventDefault();
  const [wx, wy] = toWorld(e.clientX, e.clientY);
  const f = Math.exp(-e.deltaY * 0.0015);
  cam.scale = Math.min(Math.max(cam.scale * f, 0.08), 3);
  cam.x = e.clientX - wx * cam.scale; cam.y = e.clientY - wy * cam.scale;
}, { passive: false });
addEventListener("resize", resize);

// ---- nav (Network pill + Paths dropdown) -----------------------------------
function el(tag, cls, html) {
  const n = document.createElement(tag);
  if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n;
}
function selectView(i) {
  current = i; pinned = null; closeCard(); closeMenu(); renderNav(); renderPanels(); fitView();
}
let menuEl = null;
function closeMenu() { if (menuEl) menuEl.classList.remove("open"); }
function renderNav() {
  const nav = document.getElementById("nav"); nav.innerHTML = ""; menuEl = null;
  const net = el("button", "pill" + (current === 0 ? " active" : ""), "◇ Network");
  net.onclick = () => selectView(0);
  nav.appendChild(net);

  const paths = VIEWS.slice(1);
  if (!paths.length) return;
  const onPath = current > 0;
  const label = onPath ? "Path" : "Paths";
  const trigger = el("button", "pill" + (onPath ? " active" : ""),
    label + ' <span class="caret">▾</span>');
  const menu = el("div", "menu"); menuEl = menu;
  paths.forEach((p, idx) => {
    const i = idx + 1;
    const short = "→ " + p.path.to_types.join(", ");
    const item = el("div", "menu-item" + (current === i ? " sel" : ""),
      `<span class="tick">${current === i ? "✓" : ""}</span><span class="mlabel">${short}</span>`);
    item.title = p.path.title;
    item.onclick = (ev) => { ev.stopPropagation(); selectView(i); };
    menu.appendChild(item);
  });
  trigger.onclick = (ev) => { ev.stopPropagation(); menu.classList.toggle("open"); };
  const wrap = el("div", null); wrap.style.position = "relative";
  wrap.appendChild(trigger); wrap.appendChild(menu);
  nav.appendChild(wrap);
}
addEventListener("click", closeMenu);

// ---- panels ----------------------------------------------------------------
function renderPanels() {
  const v = VIEWS[current];
  document.getElementById("subtitle").textContent =
    v.path ? v.path.title + "  ·  " + v.path.policy : "weaver network";

  const stats = document.getElementById("stats"); stats.innerHTML = "";
  let entries;
  if (v.path) {
    entries = [["steps", v.path.step_count], ["waves", v.path.waves.length],
      ["inputs", v.path.from_types.length], ["outputs", v.path.to_types.length]];
  } else {
    const s = v.graph.stats;
    entries = [["weavers", s.weavers], ["join keys", s.types],
      ["capabilities", s.capabilities], ["links", s.edges]];
  }
  entries.forEach(([k, val]) =>
    stats.appendChild(el("div", "stat", `<b>${val}</b><span>${k}</span>`)));

  const leg = document.getElementById("legend"); leg.innerHTML = "";
  ["in", "out", "mixed"].forEach((io) =>
    leg.appendChild(el("div", "legend-row",
      `<span class="dot" style="background:${TYPE_COLOR[io]}"></span>${TYPE_LABEL[io]}`)));

  const box = document.getElementById("weavers"); box.innerHTML = "";
  DATA.network.weavers.forEach((w) => {
    const row = el("div", "weaver-row" + (pinned && pinnedWeaver() === w.id ? " sel" : ""),
      `<span class="swatch" style="background:${weaverColor(w.id)}"></span>` +
      `<code>${esc(w.id)}</code><span class="meta">v${esc(w.version)}<br>${esc(w.backends.join(" · "))}</span>`);
    if (w.title) row.title = w.title;
    row.onclick = () => {
      // Find a node for this weaver in the current view (an op it owns).
      let node = null;
      for (const n of layouts[current].nodes.values())
        if (n.kind === "op" && n.weaver === w.id) { node = n; break; }
      if (!node) return;  // weaver not present in a path view
      pinned = node.id;
      const r = row.getBoundingClientRect();
      showCard(node, r.left, r.top);
      renderPanels();
    };
    box.appendChild(row);
  });
}
function pinnedWeaver() {
  const n = pinned && layouts[current].nodes.get(pinned);
  return n ? n.weaver : null;
}
const cardEl = document.getElementById("card");
function closeCard() { cardEl.style.display = "none"; }
const chips = (arr) => (arr || []).map((t) => `<span class="chip">${esc(t)}</span>`).join("") || "—";

function opCardHTML(n) {
  const w = WEAVERS[n.weaver] || {};
  const accent = weaverColor(n.weaver, 60);
  let h = `<div class="card-head"><div class="card-accent" style="background:${accent}"></div>` +
    `<div><div class="card-id">${esc(n.weaver)}</div>` +
    (w.title ? `<div class="card-title">${esc(w.title)}</div>` : "") + `</div>` +
    `<span class="card-x" onclick="closeCard()">✕</span></div>`;
  h += `<div class="kv">capability <b>${esc(n.capability)}</b></div>`;
  if (n.primary_backend) {
    const fb = n.fallback_backends.length ? n.fallback_backends.join(", ") : "none";
    h += `<div class="kv">backend <b>${esc(n.primary_backend)}</b> · fallback ${esc(fb)}</div>`;
  } else if (n.backends) {
    h += `<div class="kv">backends <b>${esc(n.backends.join(", "))}</b></div>`;
  }
  h += `<div class="kv">consumes</div>${chips(n.input_types)}`;
  h += `<div class="kv">produces (join keys)</div>${chips(n.output_types)}`;
  if (n.set_outputs && n.set_outputs.length)
    h += `<div class="kv">fans out (one→many)</div>${chips(n.set_outputs)}`;
  if (n.output_leaves && n.output_leaves.length)
    h += `<details class="fold"><summary>outputs (${n.output_leaves.length})</summary>${chips(n.output_leaves)}</details>`;
  const p = w.provenance;
  if (p) {
    h += `<div class="kv">source</div><div class="kv">${linkOrText(p.source_url)}</div>`;
    if (p.license) h += `<div class="kv">license <b>${esc(p.license)}</b></div>`;
    if (p.citation) h += `<div class="kv">cite ${linkOrText(p.citation)}</div>`;
  }
  return h;
}

function typeCardHTML(n) {
  const L = layouts[current], uniq = (a) => [...new Set(a)];
  const prod = L.edges.filter((e) => e.target === n.id && e.weaver).map((e) => e.weaver);
  const cons = L.edges.filter((e) => e.source === n.id && e.weaver).map((e) => e.weaver);
  const io = TYPE_LABEL[n.io] || "Endpoint", ioColor = TYPE_COLOR[n.io] || TYPE_IN;
  return `<div class="card-head"><div class="card-accent" style="background:${ioColor}"></div>` +
    `<div class="card-id">${esc(n.key || n.id)}</div>` +
    `<span class="card-x" onclick="closeCard()">✕</span></div>` +
    `<div class="kv"><span class="chip" style="border-color:${ioColor}">${io}</span></div>` +
    (n.description ? `<div class="kv">${esc(n.description)}</div>` : "") +
    (prod.length ? `<div class="kv">produced by</div>${chips(uniq(prod))}` : "") +
    (cons.length ? `<div class="kv">consumed by</div>${chips(uniq(cons))}` : "");
}

function showCard(n, ax, ay) {
  if (!n) { closeCard(); return; }
  cardEl.innerHTML = n.kind === "op" ? opCardHTML(n) : typeCardHTML(n);
  cardEl.style.display = "block";
  // Anchor near (ax, ay), clamped into the viewport.
  const r = cardEl.getBoundingClientRect();
  let x = ax + 18, y = ay - 10;
  if (x + r.width > innerWidth - 12) x = ax - r.width - 18;
  if (x < 12) x = 12;
  if (y + r.height > innerHeight - 12) y = innerHeight - r.height - 12;
  if (y < 12) y = 12;
  cardEl.style.left = x + "px";
  cardEl.style.top = y + "px";
}

// Draggable by its header — lets you pull an expanded card fully back on-screen.
let cardDrag = null;
cardEl.addEventListener("mousedown", (e) => {
  const head = e.target.closest(".card-head");
  if (!head || e.target.closest(".card-x")) return;
  const r = cardEl.getBoundingClientRect();
  cardDrag = { dx: e.clientX - r.left, dy: e.clientY - r.top };
  e.preventDefault();
});
addEventListener("mousemove", (e) => {
  if (!cardDrag) return;
  let x = e.clientX - cardDrag.dx, y = e.clientY - cardDrag.dy;
  x = Math.min(Math.max(x, 6), innerWidth - cardEl.offsetWidth - 6);
  y = Math.min(Math.max(y, 6), innerHeight - 44);   // keep the header grabbable
  cardEl.style.left = x + "px"; cardEl.style.top = y + "px";
});
addEventListener("mouseup", () => { cardDrag = null; });

// Run light-up + search-filter state: written by the serve UI (when present), read by the
// draw loop. searchHits = null means no filter; otherwise a Set of node ids to keep lit.
let runAnim = null;
let searchHits = null;
function runStatusOf(nodeId, now) {
  if (!runAnim) return null;
  const info = runAnim.perNode[nodeId];
  if (!info) return null;
  // live: reveal as wave events arrive (revealedWave); else timed replay.
  const reached = runAnim.live
    ? info.wave <= runAnim.revealedWave
    : (now - runAnim.start) >= info.wave * runAnim.waveMs;
  return reached ? info.status : "pending";
}


// ---- boot ------------------------------------------------------------------
if (DATA.meta.problems && DATA.meta.problems.length) {
  const b = document.getElementById("banner");
  b.style.display = "block";
  b.innerHTML = "<b>note</b><br>" + DATA.meta.problems.join("<br>");
}
resize(); renderNav(); renderPanels(); fitView(); if (window.setupBuilder) setupBuilder(); requestAnimationFrame(frame);
</script>
</body>
</html>
