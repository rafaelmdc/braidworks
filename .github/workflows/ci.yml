name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a branch cancels its still-running CI — no wasted minutes on stale commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
      - name: Sync workspace
        run: uv sync --all-extras
      - name: Lint
        run: make lint
      - name: Test
        run: make test
