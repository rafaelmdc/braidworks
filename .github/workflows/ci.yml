name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 6 * * 1"  # Weekly CodeQL scan, including unchanged code.

permissions:
  contents: read

# A new push to a branch cancels its still-running CI — no wasted minutes on stale commits.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"
      - name: Sync workspace
        run: uv sync --all-extras
      - name: Lint
        run: make lint
      - name: Capability documentation
        run: make docs-check
      - name: Test
        run: make test

  artifacts:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"
      - name: Build every wheel and source distribution
        run: uv build --all-packages --out-dir "$RUNNER_TEMP/braidworks-artifacts"
      - name: Check contents and clean installations
        run: >-
          uv run --no-project --python 3.12 python tools/check_artifacts.py
          "$RUNNER_TEMP/braidworks-artifacts" --python 3.12

  analyze:
    if: github.event_name != 'pull_request' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      security-events: write  # upload results to code scanning
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"

  tag:
    needs: [test, artifacts, analyze]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Create missing release tags
        run: python tools/release_tags.py create
