name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a branch cancels its still-running CI — no wasted minutes on stale commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"
      - name: Sync workspace
        run: uv sync --all-extras
      - name: Lint
        run: make lint
      - name: Capability documentation
        run: make docs-check
      - name: Test
        run: make test

  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"
      - name: Build every wheel and source distribution
        run: uv build --all-packages --out-dir "$RUNNER_TEMP/braidworks-artifacts"
      - name: Check contents and clean installations
        run: >-
          uv run --no-project --python 3.12 python tools/check_artifacts.py
          "$RUNNER_TEMP/braidworks-artifacts" --python 3.12
