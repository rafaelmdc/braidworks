name: CodeQL

# Static security analysis (CodeQL) for the Python sources. Runs on PRs and pushes to
# main, plus a weekly scheduled scan so newly-published query packs catch issues in code
# that hasn't changed. Findings appear in the repo's Security ▸ Code scanning tab. Python
# is interpreted, so no build is needed (build-mode: none — it just reads the .py files).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 6 * * 1"  # Mondays 06:30 UTC

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write  # upload results to code scanning
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
