name: Live E2E

# Runs the live, network-hitting end-to-end tests (BRAIDWORKS_RUN_LIVE=1) that the
# normal CI gates OUT — so upstream API drift / outages (e.g. a weaver's source changing
# its response shape) surface here instead of silently passing against mocks. It is NOT
# a required check: it only runs on a schedule or on demand, so flaky third-party APIs
# can never block a merge. A red run means "go look", not "the code is broken".
on:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC
  workflow_dispatch: {}   # run on demand from the Actions tab

# Don't pile up overlapping live runs.
concurrency:
  group: live-e2e
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
      - name: Sync workspace
        run: uv sync --all-extras
      - name: Live E2E (real network calls)
        env:
          BRAIDWORKS_RUN_LIVE: "1"
          PYTEST_ADDOPTS: "-rs"  # report skip reasons so green-lightable skips surface
        run: |
          set -o pipefail
          make test 2>&1 | tee live.log
      - name: Surface green-lightable upstream warnings
        if: always()  # run even when a real (hard) failure red-lined the job
        run: |
          if grep -q "green-light if expected" live.log; then
            {
              echo "### ⚠️ Upstream availability warnings (green-light if expected)"
              echo "Transient connectivity (timeout / connection / rate-limit) — not a code"
              echo "regression. A 5xx / schema / auth error would have *failed* the job instead."
              echo
              grep -oE "upstream .*green-light if expected:.*" live.log | sort -u | sed 's/^/- /'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -oE "upstream .*green-light if expected:.*" live.log | sort -u \
              | while IFS= read -r line; do echo "::warning::$line"; done
          fi
