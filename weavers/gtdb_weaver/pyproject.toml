[project]
name = "gtdb_weaver"
version = "0.2.0"
description = "GTDB genome-based taxonomy (NCBI taxid / name -> GTDB species + lineage) — a Braidworks weaver."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["braidworks-core", "httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23", "weaverkit"]

# Registers this weaver for entry-point discovery (weaverkit view / references,
# arq workers, any registry-from-entry-points loader).
[project.entry-points."braidworks.weavers"]
gtdb = "gtdb_weaver.factory:build_gtdb_weaver"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gtdb_weaver"]

[tool.uv.sources]
braidworks-core = { workspace = true }
weaverkit = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
