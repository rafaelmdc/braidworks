[project]
name = "idmapping_weaver"
version = "0.2.0"
description = "UniProt ID mapping — cross-reference any id to/from the UniProt accession hub — a Braidworks weaver."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["braidworks-core>=0.7.1", "httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23", "weaverkit"]

# Discovered by the registry builder / weaverkit view / arq workers — name is the
# weaver_id, value a zero-arg builder returning a BaseWeaver.
[project.entry-points."braidworks.weavers"]
idmapping = "idmapping_weaver.factory:build_idmapping_weaver"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/idmapping_weaver"]

[tool.uv.sources]
braidworks-core = { workspace = true }
weaverkit = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
