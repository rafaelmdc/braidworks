# string_weaver — STRING protein–protein interaction networks.
#
# A protein's UniProt accession -> its interaction partners with confidence scores.
# STRING resolves a bare accession to its protein + species itself, so this is a
# single-input weaver keyed on `protein.uniprot.accession` (produced by uniprot_weaver),
# making it reachable directly off the protein hub. It emits stable STRING partner IDs for
# downstream mapping, plus descriptive names/count/full scored edges. Over the free, keyless STRING REST API (string-db.org/api).
[weaver]
db_name = "string"
weaver_id = "string"
kind = "lookup"
title = "STRING protein-protein interactions (accession -> partners + scores)"
version = "0.1.12"
license = "CC-BY-4.0"
citation = "https://doi.org/10.1093/nar/gkac1000"
attribution = "STRING (Szklarczyk et al.)"
source_url = "https://string-db.org"
fingerprint_source = "STRING stable 12.5 endpoint or explicit custom endpoint plus retrieval limit"
api_key = "none"
backends = ["api"]
# Real excerpt of GET https://string-db.org/api/json/interaction_partners?identifiers=P04637&limit=3
source_sample = """
[
  {
    "stringId_A": "9606.ENSP00000269305",
    "stringId_B": "9606.ENSP00000340989",
    "preferredName_A": "TP53",
    "preferredName_B": "SFN",
    "ncbiTaxonId": 9606,
    "score": 0.999,
    "nscore": 0, "fscore": 0, "pscore": 0, "ascore": 0,
    "escore": 0.981, "dscore": 0.75, "tscore": 0.859
  }
]
"""

# Bulk ID resolution and chunked partner retrieval, correlated by STRING id.
# The upstream limit bounds acquisition, not only display.
[[capability]]
id = "list_interactions"
consumes = ["protein.uniprot.accession"]
max_batch_size = 25
# Fan out stable taxon-scoped STRING IDs; UniProt ID-mapping consumes this bridge.
set_outputs = ["string.id"]

  [[capability.group]]
  id = "summary"
  outputs = ["string.id", "protein.interaction.partners", "protein.interaction.count", "protein.interaction.coverage"]

  [[capability.group]]
  id = "full"
  outputs = ["protein.interaction.records"]

# Golden runs against the deterministic fixture (string_weaver.fixture, an
# httpx.MockTransport serving a canned 2-partner response for P04637) so
# `weaverkit verify --strict` is reproducible offline.
[[golden]]
capability = "list_interactions"
input = { "protein.uniprot.accession" = "P04637" }
expect = { "protein.interaction.count" = 2 }
