[project]
name = "quickgo_weaver"
version = "0.1.3"
description = "Gene Ontology annotations (accession -> GO terms by aspect) — a Braidworks weaver."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["braidworks-core>=0.2.1", "httpx>=0.27"]

[project.entry-points."braidworks.weavers"]
quickgo = "quickgo_weaver.factory:build_quickgo_weaver"

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23", "weaverkit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quickgo_weaver"]

[tool.uv.sources]
braidworks-core = { workspace = true }
weaverkit = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
