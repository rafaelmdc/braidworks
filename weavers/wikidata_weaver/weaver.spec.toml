# wikidata_weaver — taxon scientific name -> Wikidata QID, vernacular names, and the
# English Wikipedia article title. The names + title feed Cladewright's pool
# enrichment (common names) and chain into wikipedia_weaver for pageviews (fame).
[weaver]
db_name = "wikidata"
weaver_id = "wikidata"
kind = "resolver"
title = "Wikidata taxon names (scientific name -> QID, vernacular names, enwiki title)"
version = "0.1.7"
license = "CC0-1.0"
source_url = "https://www.wikidata.org/"
citation = "Wikidata, the free knowledge base. https://www.wikidata.org/"
attribution = "Wikidata contributors (CC0)"
fingerprint_source = "query-month"
backends = ["api"]
# Observed 2026-10-09 from the runtime SPARQL query for Ursus arctos, LIMIT 1.
# Echoed sname correlates rows to inputs; optional counts/names change over time.
source_sample = """
{
  "head": {
    "vars": [
      "sname",
      "item",
      "article",
      "sitelinks",
      "vn",
      "rankLabel"
    ]
  },
  "results": {
    "bindings": [
      {
        "sname": {
          "type": "literal",
          "value": "Ursus arctos"
        },
        "item": {
          "type": "uri",
          "value": "http://www.wikidata.org/entity/Q36341"
        },
        "article": {
          "type": "uri",
          "value": "https://en.wikipedia.org/wiki/Brown_bear"
        },
        "sitelinks": {
          "datatype": "http://www.w3.org/2001/XMLSchema#integer",
          "type": "literal",
          "value": "138"
        },
        "rankLabel": {
          "xml:lang": "en",
          "type": "literal",
          "value": "species"
        },
        "vn": {
          "xml:lang": "en",
          "type": "literal",
          "value": "grizzly bear"
        }
      }
    ]
  }
}
"""

[[capability]]
id = "resolve_taxon"
consumes = ["organism.scientific_name"]
backends = ["api"]
always_computed_groups = ["core"]   # name -> QID is always resolved first

  [[capability.group]]
  id = "core"
  outputs = ["wikidata.qid", "wikipedia.title", "wikidata.sitelinks"]

  [[capability.group]]
  id = "names"
  outputs = ["organism.vernacular_names"]

  [[capability.parameter]]
  name = "expected_rank"
  type = "string"
  description = "Taxon rank (P105 English label, e.g. 'order', 'genus') used to disambiguate a cross-code homonym: when a scientific name resolves to several Wikidata items, the one whose rank matches is chosen. Omit to leave such names ambiguous (the historical behaviour)."

[[golden]]
capability = "resolve_taxon"
input = { "organism.scientific_name" = "Ursus arctos" }
expect = { "wikidata.qid" = "Q36341" }
