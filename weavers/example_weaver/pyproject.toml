[project]
name = "example_weaver"
version = "1.0.0"
description = "Example reference weaver (taxid -> traits, from a tiny CSV) — a Braidworks weaver."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["braidworks-core>=0.1.0"]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23", "weaverkit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/example_weaver"]

[tool.uv.sources]
braidworks-core = { workspace = true }
weaverkit = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
