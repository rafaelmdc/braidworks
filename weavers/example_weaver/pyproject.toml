[project]
name = "example_weaver"
version = "1.0.3"
description = "Example reference weaver (taxid -> traits, from a tiny CSV) — a Braidworks weaver."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["braidworks-core>=0.1.8"]

[project.urls]
Repository = "https://github.com/rafaelmdc/braidworks"
Documentation = "https://github.com/rafaelmdc/braidworks/blob/main/docs/index.md"
Issues = "https://github.com/rafaelmdc/braidworks/issues"

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23", "weaverkit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/example_weaver"]

[tool.uv.sources]
braidworks-core = { workspace = true }
weaverkit = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
