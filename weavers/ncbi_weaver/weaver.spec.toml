# ncbi_weaver — NCBI taxonomy resolver (organism name / taxid -> taxonomy).
# A resolver weaver: fuzzy/ambiguous name matching with candidates, two backends
# (local SQLite built from the NCBI taxdump, and the live NCBI Datasets v2 API).
# weaver_id is "ncbi" (the join namespace), distinct from the package "ncbi_weaver".
[weaver]
db_name = "ncbi"
weaver_id = "ncbi"
kind = "resolver"
title = "NCBI Taxonomy resolver (name/taxid -> taxonomy + lineage)"
version = "0.1.6"
license = "Public Domain"
citation = ""
attribution = "NCBI Taxonomy"
source_url = "https://www.ncbi.nlm.nih.gov/taxonomy"
fingerprint_source = "taxonomy_build_version recorded at DB build (local) / API contract (api)"
api_key = "optional"
backends = ["local", "api"]
source_sample = """
# NCBI taxdump names.dmp (tab-pipe-tab delimited): tax_id | name_txt | unique_name | name_class
562\t|\tEscherichia coli\t|\t\t|\tscientific name\t|
562\t|\tE. coli\t|\t\t|\tcommon name\t|
561\t|\tEscherichia\t|\t\t|\tscientific name\t|

# GET .../datasets/v2/taxonomy/taxon/216851/dataset_report?children=true (list_children)
# returns one report per node in the subtree; `parents` ends with the immediate parent.
{
  "reports": [
    { "taxonomy": { "tax_id": 853, "rank": "SPECIES",
        "current_scientific_name": { "name": "Faecalibacterium prausnitzii" },
        "parents": [2, 1239, 853058, 216851] } },
    { "taxonomy": { "tax_id": 4203190, "rank": "SPECIES",
        "current_scientific_name": { "name": "Faecalibacterium gallinarum" },
        "parents": [2, 1239, 853058, 216851] } }
  ],
  "total_count": 121
}
"""

[bulk]
backend = "local"
archive_url = "https://ftp.ncbi.nlm.nih.gov/pub/taxonomy/taxdump.tar.gz"
filename = "ncbi_taxonomy.sqlite"

# ncbi.resolve_name: free-text organism name -> taxonomy core + optional lineage.
[[capability]]
id = "ncbi.resolve_name"
consumes = ["organism.name"]
max_batch_size = 1000
# The resolver always resolves the name -> taxid ("core") first, even if only
# lineage was requested, so core is always part of the computed cache key.
always_computed_groups = ["core"]

  [[capability.group]]
  id = "core"
  outputs = [
    "ncbi.taxon.id",
    "organism.scientific_name",
    "ncbi.taxon.rank",
    "ncbi.taxon.parent_id",
    "ncbi.taxon.match_type",
    "ncbi.taxon.review_required",
  ]

  [[capability.group]]
  id = "lineage"
  outputs = ["ncbi.taxon.lineage"]

# ncbi.describe_taxon: a known taxid -> taxonomy core + optional lineage.
# Consumes the taxid, so it does not re-produce ncbi.taxon.id.
[[capability]]
id = "ncbi.describe_taxon"
consumes = ["ncbi.taxon.id"]
max_batch_size = 1000
always_computed_groups = ["core"]

  [[capability.group]]
  id = "core"
  outputs = [
    "organism.scientific_name",
    "ncbi.taxon.rank",
    "ncbi.taxon.parent_id",
  ]

  [[capability.group]]
  id = "lineage"
  outputs = ["ncbi.taxon.lineage"]

# ncbi.list_children: a taxid -> its descendant taxids of a given rank (default
# species). API-only — it walks the live NCBI taxonomy subtree via the Datasets v2
# dataset_report?children=true endpoint. ncbi.taxon.id is a set output (the fan
# dimension): "genus -> every species, each drillable".
[[capability]]
id = "ncbi.list_children"
consumes = ["ncbi.taxon.id"]
backends = ["api"]
max_batch_size = 1000
set_outputs = ["ncbi.taxon.id"]

  [[capability.group]]
  id = "children"
  outputs = ["ncbi.taxon.id", "ncbi.taxon.children_count", "ncbi.taxon.children_records"]

  [[capability.parameter]]
  name = "rank"
  type = "string"
  default = "species"
  description = "Descendant rank to return (e.g. species, genus, strain)."

# Golden inputs are resident in the deterministic fixture DB (ncbi_weaver.fixture,
# the Faecalibacterium clade) so `weaverkit verify --strict` runs them reproducibly.
[[golden]]
capability = "ncbi.resolve_name"
input = { "organism.name" = "Faecalibacterium prausnitzii" }
expect = { "ncbi.taxon.id" = 853, "organism.scientific_name" = "Faecalibacterium prausnitzii" }

[[golden]]
capability = "ncbi.describe_taxon"
input = { "ncbi.taxon.id" = 853 }
expect = { "organism.scientific_name" = "Faecalibacterium prausnitzii" }
