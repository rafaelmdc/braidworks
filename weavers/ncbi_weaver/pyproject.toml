[project]
name = "ncbi_weaver"
version = "0.1.8"
description = "NCBI weaver for Braidworks (taxonomy, via local SQLite + Datasets v2 API backends)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "braidworks-core>=0.4.1",
  "rapidfuzz>=3.0,<4.0",
  "httpx>=0.27",
  "platformdirs>=4.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
ncbi-weaver = "taxonomy_tools.cli:main"

# Discovered by braidworks-celery workers (and any registry builder) — name is the
# weaver_id, value is a zero-arg builder returning a BaseWeaver.
[project.entry-points."braidworks.weavers"]
ncbi = "ncbi_weaver.factory:build_ncbi_weaver"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ncbi_weaver", "src/taxonomy_resolver", "src/taxonomy_tools"]

[tool.uv.sources]
braidworks-core = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
