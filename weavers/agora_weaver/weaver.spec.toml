# agora_weaver — AGORA2 genome-scale metabolic reconstructions (VMH).
# A lookup weaver: an organism (by NCBI taxid) -> its AGORA2 reconstruction(s)
# (id + source genome) and, on request, the reaction repertoire of those models.
# One local backend:
#   local: core = a bundled taxid -> {reconstruction_id, gcf} crosswalk (all 7,302
#          AGORA2 strains, offline); reactions = the per-model reaction repertoire
#          built by `agora ensure` from the AGORA2 SBML archive (consent-gated).
# Consumes only taxid — name->taxid is ncbi_weaver's job; the braider chains them.
[weaver]
db_name = "agora"
weaver_id = "agora"
kind = "lookup"
title = "AGORA2 metabolic reconstructions (NCBI taxid -> reconstruction + reaction repertoire)"
version = "0.2.10"
license = "CC-BY-NC-4.0"
citation = "https://doi.org/10.1038/s41587-022-01628-0"
attribution = "AGORA2 / Virtual Metabolic Human (VMH), Heinken et al., Nat Biotechnol 2023 (data CC BY-NC 4.0)"
source_url = "https://www.vmh.life"
fingerprint_source = "AGORA2 release tag for the bundled crosswalk (v2.01); reaction DB: content hash of the parsed SBML archive"
backends = ["local"]
# Real excerpts. (1) The bundled crosswalk row (from AGORA2 Supplementary Table S1):
# ncbi_taxid -> reconstruction id (MicrobeID) + source RefSeq assembly (GCF).
# (2) A reaction from that model's SBML (id 'R_<VMH abbreviation>'), enriched with the
# VMH /_api/reactions/ crosswalk (subsystem / EC / KEGG / Rhea).
source_sample = """
# AGORA2 Supplementary Table S1 (selected columns)
ncbi_taxid	microbe_id	gcf
592010	Abiotrophia_defectiva_ATCC_49176	GCF_000160075.2

# Observed 2026-10-10 GET /api/getMicrobeReconstructions?id=Abiotrophia_defectiva_ATCC_49176&version=agora2_2.01
# Metadata excerpt (not the full reaction response):
# {"id":"microbe_1261","name":"Abiotrophia defectiva ATCC 49176","reconstruction_id":1261,"curation_status":"2.01","source":"AGORA2","family_key":"agora2_2.01","version":"2.01"}
# Same explicit release selector with format=sbml: valid XML, model id="microbe_1261".

# AGORA2_SBML.zip :: Abiotrophia_defectiva_ATCC_49176.xml  (reaction element)
<reaction id="R_ACGAMK" name="N-Acetylglucosamine kinase" ...>
# VMH /_api/reactions/?abbreviation=ACGAMK -> {"subsystem":"Aminosugar metabolism","ecnumber":"2.7.1.59","keggId":"R02326"}
"""

# One organism (by taxid) -> its AGORA2 reconstruction(s) + optional reaction repertoire.
[[capability]]
id = "describe_metabolic_reconstruction"
consumes = ["ncbi.taxon.id"]
max_batch_size = 50

  [[capability.group]]
  id = "core"
  outputs = ["microbe.metabolism.reconstruction"]

  [[capability.group]]
  id = "reactions"
  outputs = ["microbe.metabolism.reactions"]

  # The genome-scale model itself (SBML), for community-flux / seed-set complementarity.
  # Fetches just the ~8 MB individual model from VMH (lazy, cached), not the 2.17 GB archive;
  # returns a local path per reconstruction. The substrate for metabolic.complementarity.
  [[capability.group]]
  id = "model"
  outputs = ["microbe.metabolism.sbml"]

[[capability]]
id = "list_reconstructions"
consumes = ["ncbi.taxon.id", "genome.accession"]
consumes_any = true
max_batch_size = 50
set_outputs = ["microbe.agora.reconstruction_id"]

  [[capability.group]]
  id = "reconstructions"
  outputs = ["microbe.agora.reconstruction_id", "microbe.agora.reconstructions", "microbe.agora.coverage"]

[[capability]]
id = "describe_reconstruction"
consumes = ["microbe.agora.reconstruction_id"]
max_batch_size = 50

  [[capability.group]]
  id = "identity"
  outputs = ["microbe.agora.reconstruction"]

  [[capability.group]]
  id = "artifact"
  outputs = ["microbe.agora.artifact"]

  [[capability.group]]
  id = "reactions"
  outputs = ["microbe.metabolism.reactions"]

  [[capability.group]]
  id = "model"
  outputs = ["microbe.metabolism.sbml"]

# Goldens run against build_agora_weaver_fixture (bundled crosswalk + a tiny fixture
# reaction DB), so `verify --strict` is reproducible offline.
# core: Abiotrophia defectiva (taxid 592010) -> its one AGORA2 reconstruction.
[[golden]]
capability = "describe_metabolic_reconstruction"
input = { "ncbi.taxon.id" = "592010" }
expect = { "microbe.metabolism.reconstruction" = [ { reconstruction_id = "Abiotrophia_defectiva_ATCC_49176", gcf_id = "GCF_000160075.2" } ] }

# reactions: the same organism's repertoire (from the fixture reaction DB) — two real
# AGORA2 reactions enriched with their real VMH subsystem/EC.
[[golden]]
capability = "describe_metabolic_reconstruction"
input = { "ncbi.taxon.id" = "592010" }
expect = { "microbe.metabolism.reactions" = [ { reconstruction_id = "Abiotrophia_defectiva_ATCC_49176", abbreviation = "23DHMPO", subsystem = "Valine, leucine, and isoleucine metabolism", ec = "1.1.1.86" }, { reconstruction_id = "Abiotrophia_defectiva_ATCC_49176", abbreviation = "26DAPLLAT", subsystem = "Lysine metabolism", ec = "2.6.1.83" } ] }

[[golden]]
capability = "list_reconstructions"
input = { "ncbi.taxon.id" = "592010" }
expect = { "microbe.agora.reconstruction_id" = ["AGORA2-v2.01:Abiotrophia_defectiva_ATCC_49176"] }


[[capability]]
id = "list_genomes"
consumes = ["microbe.agora.reconstruction_id"]
set_outputs = ["genome.accession"]
  [[capability.group]]
  id = "genomes"
  outputs = ["genome.accession", "microbe.agora.genome_listing"]

[[capability]]
id = "list_reactions"
consumes = ["microbe.agora.reconstruction_id"]
set_outputs = ["reaction.vmh.id"]
  [[capability.group]]
  id = "reactions"
  outputs = ["reaction.vmh.id", "microbe.agora.reaction_listing"]

[[capability]]
id = "describe_reaction"
consumes = ["reaction.vmh.id"]
  [[capability.group]]
  id = "reaction"
  outputs = ["reaction.vmh.record"]

[[golden]]
capability = "list_genomes"
input = { "microbe.agora.reconstruction_id" = "AGORA2-v2.01:Abiotrophia_defectiva_ATCC_49176" }
expect = { "genome.accession" = ["GCF_000160075.2"] }

[[golden]]
capability = "list_reactions"
input = { "microbe.agora.reconstruction_id" = "AGORA2-v2.01:Abiotrophia_defectiva_ATCC_49176" }
expect = { "reaction.vmh.id" = ["23DHMPO", "26DAPLLAT"] }
