[project]
name = "disbiome_weaver"
version = "0.1.1"
description = "Disbiome microbe–disease associations (taxid -> diseases + direction) — a Braidworks weaver."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["braidworks-core"]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23", "weaverkit"]

# Discovered by braidworks-celery workers — name is the weaver_id, value a zero-arg builder.
[project.entry-points."braidworks.weavers"]
disbiome = "disbiome_weaver.factory:build_disbiome_weaver"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/disbiome_weaver"]

[tool.uv.sources]
braidworks-core = { workspace = true }
weaverkit = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
