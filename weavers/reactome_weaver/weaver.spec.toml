# reactome_weaver — curated biological pathways via Reactome.
#
# A protein's UniProt accession -> the Reactome pathways it participates in (the
# systems-level "what process is it part of" panel). A terminal weaver off the protein
# hub: single-input on `protein.uniprot.accession`. Reactome maps the accession to its
# pathways itself; the backend dedups to distinct pathways and orders them
# deterministically. Free, keyless Reactome ContentService API (CC0 data).
[weaver]
db_name = "reactome"
weaver_id = "reactome"
kind = "lookup"
title = "Reactome pathways (accession -> pathways)"
version = "0.1.5"
license = "CC0-1.0"
citation = "https://doi.org/10.1093/nar/gkab1028"
attribution = "Reactome"
source_url = "https://reactome.org"
fingerprint_source = "Reactome ContentService API contract (reactome.org/ContentService)"
api_key = "none"
backends = ["api"]
# Real excerpts: GET /data/mapping/UniProt/P04637/pathways (list) + GET /data/query/{id} (detail).
source_sample = """
# /data/mapping/UniProt/P04637/pathways
[
  {
    "stId": "R-HSA-111448",
    "displayName": "Activation of NOXA and translocation to mitochondria",
    "schemaClass": "Pathway",
    "isInDisease": false
  }
]
# /data/query/R-HSA-69541
{
  "stId": "R-HSA-69541",
  "displayName": "Stabilization of p53",
  "schemaClass": "Pathway",
  "speciesName": "Homo sapiens",
  "isInDisease": false,
  "releaseDate": "2004-07-06"
}
"""

# One accession -> one mapping/pathways call. Reactome has no batch endpoint that
# preserves per-query grouping, so batches fan out per accession.
[[capability]]
id = "list_pathways"
consumes = ["protein.uniprot.accession"]
max_batch_size = 25
# pathway.reactome.id is one→many: the weaver emits every distinct pathway stId, so a
# caller can fan out (ExpandPolicy) one child per pathway — "protein -> all pathways,
# each drillable". names/count/records stay the top-N display + true total.
set_outputs = ["pathway.reactome.id"]

  [[capability.group]]
  id = "summary"
  outputs = ["pathway.reactome.id", "pathway.reactome.names", "pathway.reactome.count"]

  [[capability.group]]
  id = "full"
  outputs = ["pathway.reactome.records"]

# The consumer of the fan dimension: one pathway id -> that pathway's detail (Reactome
# /data/query/{id}). Consumes pathway.reactome.id (what list_pathways produces), so a
# fanned pathway is drillable: protein -> list_pathways -> fan -> describe_pathway.
[[capability]]
id = "describe_pathway"
consumes = ["pathway.reactome.id"]
max_batch_size = 25

  [[capability.group]]
  id = "detail"
  outputs = [
    "pathway.reactome.display_name",
    "pathway.reactome.species",
    "pathway.reactome.in_disease",
    "pathway.reactome.detail",
  ]

# Golden runs against the deterministic fixture (reactome_weaver.fixture, an
# httpx.MockTransport serving a canned 2-pathway response for P04637 with a duplicate
# stId, plus a /data/query/{id} detail object for R-HSA-69541) so `weaverkit verify
# --strict` is reproducible.
[[golden]]
capability = "list_pathways"
input = { "protein.uniprot.accession" = "P04637" }
expect = { "pathway.reactome.count" = 2 }

[[golden]]
capability = "describe_pathway"
input = { "pathway.reactome.id" = "R-HSA-69541" }
expect = { "pathway.reactome.display_name" = "Stabilization of p53" }
