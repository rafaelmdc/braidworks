# pdbe_weaver — experimental 3D structures via EBI PDBe.
#
# A protein's UniProt accession -> the PDB experimental structures covering it, via
# PDBe's curated "best_structures" mapping (ranked by coverage + resolution). A terminal
# weaver off the protein hub: single-input on `protein.uniprot.accession`. PDBe returns
# one row per (structure, chain), so the backend dedups to distinct PDB entries and
# orders them best-first, deterministically. Free, keyless EBI PDBe API.
[weaver]
db_name = "pdbe"
weaver_id = "pdbe"
kind = "lookup"
title = "PDB experimental structures via PDBe (accession -> structures)"
version = "0.1.14"
license = "CC0-1.0"
citation = "https://doi.org/10.1093/nar/gkz990"
attribution = "wwPDB / EMBL-EBI PDBe"
source_url = "https://www.ebi.ac.uk/pdbe"
fingerprint_source = "effective PDBe endpoint plus positive display limit (unversioned live contents)"
api_key = "none"
backends = ["api"]
# Real excerpt of GET https://www.ebi.ac.uk/pdbe/api/mappings/best_structures/P04637
source_sample = """
{
  "P04637": [
    {
      "pdb_id": "9r2q",
      "chain_id": "K",
      "experimental_method": "Electron Microscopy",
      "resolution": 3.2,
      "tax_id": 9606,
      "unp_start": 1,
      "unp_end": 393,
      "start": 25,
      "end": 417,
      "coverage": 1.0
    }
  ]
}
# GET https://www.ebi.ac.uk/pdbe/api/pdb/entry/summary/1tup (describe_structure)
{
  "1tup": [
    {
      "title": "TUMOR SUPPRESSOR P53 COMPLEXED WITH DNA",
      "experimental_method": ["X-ray diffraction"],
      "release_date": "19950711",
      "deposition_date": "19950711",
      "entry_authors": ["Cho, Y.", "Gorina, S.", "Jeffrey, P.D.", "Pavletich, N.P."]
    }
  ]
}
# POST /validation/summary_quality_scores/entry body=1tup
{"1tup":{"geometry_quality":1.73,"data_quality":null,"overall_quality":1.73,"experiment_data_available":false}}
# Observed 1cbs extra detail, 2026-10-10
# molecules: {"entity_id":1,"in_chains":["A"],"in_struct_asyms":["A"]}
# assembly: {"assembly_id":"1","details":"author_defined_assembly"}
# ligand: {"chem_comp_id":"REA","author_residue_number":200,"struct_asym_id":"B"}
# SIFTS residue: <crossRefDb dbSource="PDB" dbResNum="1" dbChainId="A"/>
# <crossRefDb dbSource="UniProt" dbAccessionId="P29373" dbResNum="2"/>
"""

# Distinct accessions share POST /mappings/best_structures chunks of 100, keyed
# by accession in the response; a singleton uses GET. Query duplicates retain positions.
[[capability]]
id = "list_structures"
consumes = ["protein.uniprot.accession"]
max_batch_size = 25
# pdb.id is one→many: the weaver emits every distinct PDB id, so a caller can fan out
# (ExpandPolicy) one child per structure — "protein -> all structures, each drillable".
# structure.pdb.ids/count/records stay the top-N display + true total.
set_outputs = ["pdb.id"]

  [[capability.group]]
  id = "summary"
  outputs = ["pdb.id", "structure.pdb.ids", "structure.pdb.count"]

  [[capability.group]]
  id = "full"
  outputs = ["structure.pdb.records"]

# The consumer of the fan dimension: one PDB id -> that structure's detail (PDBe
# /pdb/entry/summary/{id}). Consumes pdb.id (what list_structures produces), so a
# fanned structure is drillable: protein -> list_structures -> fan -> describe_structure.
[[capability]]
id = "describe_structure"
consumes = ["pdb.id"]
max_batch_size = 25

  [[capability.group]]
  id = "detail"
  outputs = [
    "structure.pdb.title",
    "structure.pdb.method",
    "structure.pdb.release_date",
    "structure.pdb.detail",
  ]

  [[capability.group]]
  id = "quality"
  outputs = ["structure.pdb.quality"]

  [[capability.group]]
  id = "entities"
  outputs = ["structure.pdb.entities"]

  [[capability.group]]
  id = "assemblies"
  outputs = ["structure.pdb.assemblies"]

  [[capability.group]]
  id = "ligands"
  outputs = ["structure.pdb.ligands"]

  [[capability.group]]
  id = "mappings"
  outputs = ["structure.pdb.mappings"]

  [[capability.group]]
  id = "residues"
  outputs = ["structure.pdb.residues"]

  [[capability.group]]
  id = "coordinates"
  outputs = ["structure.pdb.coordinates"]

# Golden runs against the deterministic fixture (pdbe_weaver.fixture, an
# httpx.MockTransport serving a canned best_structures response for P04637 with two
# chains of one structure, plus a /pdb/entry/summary/{id} detail object for 1tup) so
# `weaverkit verify --strict` is reproducible offline.
[[golden]]
capability = "list_structures"
input = { "protein.uniprot.accession" = "P04637" }
expect = { "structure.pdb.count" = 2 }

[[golden]]
capability = "describe_structure"
input = { "pdb.id" = "1tup" }
expect = { "structure.pdb.title" = "TUMOR SUPPRESSOR P53 COMPLEXED WITH DNA" }
