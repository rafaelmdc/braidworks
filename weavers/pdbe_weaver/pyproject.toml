[project]
name = "pdbe_weaver"
version = "0.1.1"
description = "PDB experimental structures via PDBe (accession -> structures) — a Braidworks weaver."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["braidworks-core>=0.1.7", "httpx>=0.27"]

[project.entry-points."braidworks.weavers"]
pdbe = "pdbe_weaver.factory:build_pdbe_weaver"

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23", "weaverkit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdbe_weaver"]

[tool.uv.sources]
braidworks-core = { workspace = true }
weaverkit = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
