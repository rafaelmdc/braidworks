[project]
name = "uniprot_weaver"
version = "0.1.2"
description = "UniProt protein identity (gene/protein query -> accession + taxid + annotation) — a Braidworks weaver."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["braidworks-core>=0.8.0", "httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23", "weaverkit"]

# Discovered by the registry builder / weaverkit view / arq workers — name is the
# weaver_id, value a zero-arg builder returning a BaseWeaver.
[project.entry-points."braidworks.weavers"]
uniprot = "uniprot_weaver.factory:build_uniprot_weaver"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uniprot_weaver"]

[tool.uv.sources]
braidworks-core = { workspace = true }
weaverkit = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
