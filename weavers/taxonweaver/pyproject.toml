[project]
name = "taxonweaver"
version = "0.1.0"
description = "NCBI taxonomy weaver for Braidworks: local SQLite + Datasets v2 API backends."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "braidworks-core",
  "rapidfuzz>=3.0,<4.0",
  "httpx>=0.27",
  "platformdirs>=4.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
taxon-weaver = "taxonomy_tools.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taxonweaver", "src/taxonomy_resolver", "src/taxonomy_tools"]

[tool.uv.sources]
braidworks-core = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
