[project]
name = "gmrepo_weaver"
version = "0.1.0"
description = "GMrepo gut-metagenome abundances (taxid -> prevalence + median relative abundance, global and per-phenotype) — a Braidworks weaver."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["braidworks-core"]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23", "weaverkit"]

# Registers this weaver for entry-point discovery (weaverkit view / references,
# arq workers, any registry-from-entry-points loader).
[project.entry-points."braidworks.weavers"]
gmrepo = "gmrepo_weaver.factory:build_gmrepo_weaver"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gmrepo_weaver"]

[tool.uv.sources]
braidworks-core = { workspace = true }
weaverkit = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
