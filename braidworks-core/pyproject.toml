[project]
name = "braidworks-core"
version = "0.4.1"
description = "Core abstractions for Braidworks: strands, weavers, registry, braider, executor."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["networkx>=3.0", "platformdirs>=4.0"]

[project.scripts]
braidworks = "braidworks.core.cli:main"

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/braidworks"]
