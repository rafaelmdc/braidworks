[project]
name = "braidworks-core"
version = "0.19.1"
description = "Core abstractions for Braidworks: strands, weavers, registry, braider, executor."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["networkx>=3.0", "platformdirs>=4.0"]

[project.urls]
Repository = "https://github.com/rafaelmdc/braidworks"
Documentation = "https://github.com/rafaelmdc/braidworks/blob/main/docs/index.md"
Issues = "https://github.com/rafaelmdc/braidworks/issues"

[project.scripts]
braidworks = "braidworks.core.cli:main"

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/braidworks"]
